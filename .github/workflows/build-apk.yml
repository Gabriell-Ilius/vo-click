name: Gerar APK - Olhos da Vo

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk OlhosDaVo-v1.7.apk

      - name: Disponibilizar APK nos Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OlhosDaVo-APK
          path: OlhosDaVo-v1.7.apk

      - name: Publicar APK na aba Releases (Download direto no celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.${{ github.run_number }}
          name: "Olhos da Vó v1.7 - Calibrador Visual Garantido + Pulso de Clique (Build #${{ github.run_number }})"
          body: |
            ### 📱 Download Direto para o Celular (`OlhosDaVo-v1.7.apk`)
            Toque em **`OlhosDaVo-v1.7.apk`** abaixo em **Assets** para baixar e instalar.
            - **🎯 Seleção Visual dos Cliques 1 e 2 com Gravação Síncrona (`commit()`):** Mostra as coordenadas X,Y mudando em tempo real enquanto você arrasta as bolinhas e confirma os valores guardados na tela.
            - **🟢 Pulso Verde no Momento do Clique:** Pisca um círculo verde exatamente onde o app está tocando para você ver o Clique 1 e o Clique 2 acontecendo na tela!
            - **⏱️ Espera de 4.0s para o Gemini Live conectar** antes de dar o Clique 2 na câmera.
          files: OlhosDaVo-v1.7.apk
          prerelease: false
