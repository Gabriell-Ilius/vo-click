name: Gerar APK - Olhos da Vo

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk OlhosDaVo-v1.6.apk

      - name: Disponibilizar APK nos Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OlhosDaVo-APK
          path: OlhosDaVo-v1.6.apk

      - name: Publicar APK na aba Releases (Download direto no celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.${{ github.run_number }}
          name: "Olhos da Vó v1.6 - Ícone do Olho + Clique Único na Câmera (Build #${{ github.run_number }})"
          body: |
            ### 📱 Download Direto para o Celular (`OlhosDaVo-v1.6.apk`)
            Toque em **`OlhosDaVo-v1.6.apk`** abaixo em **Assets** para baixar e instalar.
            - **👁️ Ícone Original do Olho Amarelo restaurado** no app, na tela principal e no Widget 2x2.
            - **📷 Abertura da Câmera (baseada na v1.3, com parada imediata após o 1º clique):** Localiza o botão da câmera na árvore da tela, toca no centro exato dele 1 única vez e encerra na hora para a câmera continuar aberta!
          files: OlhosDaVo-v1.6.apk
          prerelease: false
