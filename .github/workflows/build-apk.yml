name: Gerar APK - Olhos da Vo

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk OlhosDaVo-v1.5.apk

      - name: Disponibilizar APK nos Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OlhosDaVo-APK
          path: OlhosDaVo-v1.5.apk

      - name: Publicar APK na aba Releases (Download direto no celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.${{ github.run_number }}
          name: "Olhos da Vó v1.5 - Comando Virtual Direto + Nova UI (Build #${{ github.run_number }})"
          body: |
            ### 📱 Download Direto para o Celular (`OlhosDaVo-v1.5.apk`)
            Toque em **`OlhosDaVo-v1.5.apk`** abaixo em **Assets** para baixar e instalar.
            - **⚡ 100% Comando Virtual (`ACTION_CLICK`):** Localiza o objeto virtual do botão Live e o objeto virtual do botão Câmera na barra inferior do Gemini Live e envia 1 único comando virtual (sem precisar calibrar coordenadas na tela e sem abrir/fechar a câmera).
          files: OlhosDaVo-v1.5.apk
          prerelease: false
