name: Gerar APK - Olhos da Vo

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk OlhosDaVo-v1.9.apk

      - name: Disponibilizar APK nos Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OlhosDaVo-APK
          path: OlhosDaVo-v1.9.apk

      - name: Publicar APK na aba Releases (Download direto no celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9.${{ github.run_number }}
          name: "Olhos da Vó v1.9 - Fecha Sessão Anterior do Gemini Automaticamente (Build #${{ github.run_number }})"
          body: |
            ### 📱 Download Direto para o Celular (`OlhosDaVo-v1.9.apk`)
            Toque em **`OlhosDaVo-v1.9.apk`** abaixo em **Assets** para baixar e atualizar.
            - **🔄 Reinício Limpo se o Gemini já estiver aberto:** Antes de fazer os cliques, encerra processos anteriores do Gemini (`FLAG_ACTIVITY_CLEAR_TASK` + `killBackgroundProcesses`), confere se o Gemini Live já estava aberto na tela, fecha a sessão anterior e reabre o Gemini do zero antes de dar o Clique 1 e o Clique 2!
          files: OlhosDaVo-v1.9.apk
          prerelease: false
