name: Gerar APK - Olhos da Vo

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk OlhosDaVo-v1.8.apk

      - name: Disponibilizar APK nos Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OlhosDaVo-APK
          path: OlhosDaVo-v1.8.apk

      - name: Publicar APK na aba Releases (Download direto no celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.${{ github.run_number }}
          name: "Olhos da Vó v1.8 - Controle de Tempo dos Cliques 1 e 2 (Build #${{ github.run_number }})"
          body: |
            ### 📱 Download Direto para o Celular (`OlhosDaVo-v1.8.apk`)
            Toque em **`OlhosDaVo-v1.8.apk`** abaixo em **Assets** para baixar e atualizar.
            - **⏱️ Tempos Mais Calmos por Padrão (3.0s e 5.5s):** Ignora o tempo antigo de 2.2s que tinha ficado salvo na memória do celular e permite ajustar separadamente a **Espera até o Clique 1 (Live)** e a **Espera até o Clique 2 (Câmera)** com botões `−` e `+`.
          files: OlhosDaVo-v1.8.apk
          prerelease: false
