name: Gerar APK - Olhos da Vo

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk OlhosDaVo-v1.4.apk

      - name: Disponibilizar APK nos Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OlhosDaVo-APK
          path: OlhosDaVo-v1.4.apk

      - name: Publicar APK na aba Releases (Download direto no celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.${{ github.run_number }}
          name: "Olhos da Vó v1.4 - Nova UI + Calibrador Visual Flutuante (Build #${{ github.run_number }})"
          body: |
            ### 📱 Download Direto para o Celular (`OlhosDaVo-v1.4.apk`)
            Toque em **`OlhosDaVo-v1.4.apk`** abaixo em **Assets** para baixar e instalar.
            - **🎯 Calibrador Visual de Alvos na Tela:** Chega de barrinhas de porcentagem! Toque em **"Posicionar Alvos (1) e (2) na Tela"**, arraste a bolinha `(1)` para cima do botão Live e a bolinha `(2)` para cima do botão Câmera e salve!
            - **🎨 Nova Interface Material 3:** Visual moderno em azul noturno e dourado, com ícone redesenhado e cards limpos.
            - **📷 Correção do Clique Único:** Garante 1 único toque na câmera para nunca abrir e fechar em seguida.
          files: OlhosDaVo-v1.4.apk
          prerelease: false
