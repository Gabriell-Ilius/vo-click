name: Gerar APK - Olhos da Vo

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk OlhosDaVo-v1.2.apk

      - name: Disponibilizar APK nos Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OlhosDaVo-APK
          path: OlhosDaVo-v1.2.apk

      - name: Publicar APK na aba Releases (Download direto no celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_number }}
          name: "Olhos da Vó v1.2 - Com Widget Grande 2x2 (Build #${{ github.run_number }})"
          body: |
            ### 📱 Download Direto para o Celular (v1.2 com Widget 2x2)
            Toque no arquivo **`OlhosDaVo-v1.2.apk`** abaixo em **Assets** para baixar e atualizar.
            Depois, abra as **Configurações da Família** dentro do app e toque no botão amarelo **"📌 COLOCAR WIDGET GRANDE (2x2) NA TELA INICIAL"**.
          files: OlhosDaVo-v1.2.apk
          prerelease: false
