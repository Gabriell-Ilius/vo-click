name: Gerar APK - Olhos da Vo

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk OlhosDaVo-v1.3.apk

      - name: Disponibilizar APK nos Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OlhosDaVo-APK
          path: OlhosDaVo-v1.3.apk

      - name: Publicar APK na aba Releases (Download direto no celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.${{ github.run_number }}
          name: "Olhos da Vó v1.3 - Correção Câmera + Widget 2x2 (Build #${{ github.run_number }})"
          body: |
            ### 📱 Download Direto para o Celular (v1.3)
            Toque no arquivo **`OlhosDaVo-v1.3.apk`** abaixo em **Assets** para baixar e instalar.
            - **Correção para o celular da avó:** Ignora janelas de sistema/launcher durante o carregamento, detecta a altura exata da barra inferior do Gemini Live (mesmo em celulares com barra de 3 botões `◀ ● ■`) e adiciona o botão de fixar o Widget 2x2 na tela inicial.
          files: OlhosDaVo-v1.3.apk
          prerelease: false
